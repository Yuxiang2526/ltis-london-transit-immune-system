[project]
name = "ltis-analysis"
version = "0.1.0"
description = "London Transit Immune System data pipeline (CASA0029 Group 17)"
authors = [
    { name = "Yuxiang Fan" },
    { name = "Siyan Tao" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # Core spatial stack
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rtree>=1.2",
    "pyogrio>=0.9",

    # Tabular
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",

    # I/O + HTTP
    "requests>=2.32",
    "tqdm>=4.66",

    # Network analysis (for dependency / redundancy indicators)
    "networkx>=3.3",

    # Optional: routing / isochrones for cycle / walk fallback
    # "r5py>=0.1",   # uncomment when isochrone work begins

    # Notebook environment
    "jupyterlab>=4.2",
    "ipykernel>=6.29",

    # Plotting (analysis-side, not web)
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "contextily>=1.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "nbqa>=1.8",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
