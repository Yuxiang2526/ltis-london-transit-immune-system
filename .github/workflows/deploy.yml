name: Deploy LTIS to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Inject Mapbox token into Network Map HTML
        run: |
          if [ -n "${{ secrets.MAPBOX_TOKEN }}" ]; then
            echo "Injecting MAPBOX_TOKEN secret into network-map HTML..."
            sed -i 's|MAPBOX_TOKEN_PLACEHOLDER|${{ secrets.MAPBOX_TOKEN }}|g' \
              public/network-map/London_PTAL_Accessibility_Map.html
          else
            echo "::warning::MAPBOX_TOKEN secret not set; Network Map will not render basemap"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/ltis-london-transit-immune-system/' }}
        run: npm run build

      - name: Add 404.html SPA fallback
        # GitHub Pages serves 404.html for any path that isn't a real file.
        # By copying the built index.html to dist/404.html, deep links like
        # /explore, /network, /methodology and /about resolve through the
        # React Router instead of GitHub's generic Page-Not-Found.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
